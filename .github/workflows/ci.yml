name: 🧪 CI — Build & Type Check

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  # Cho phép chạy thủ công từ GitHub Actions tab
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # Job 1: Kiểm tra TypeScript & Build
  # ─────────────────────────────────────────
  type-check-and-build:
    name: 🔍 Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript type check
        run: npx tsc --noEmit

      - name: 🏗️ Build production bundle
        env:
          # Dùng SQLite file nội bộ cho CI build
          TURSO_DATABASE_URL: file:./sqlite.db
          TURSO_AUTH_TOKEN: ""
        run: npm run build

      - name: 📊 Upload build artifacts (optional preview)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-output
          path: .output/public/
          retention-days: 3

  # ─────────────────────────────────────────
  # Job 2: Test giao diện bằng Playwright
  # ─────────────────────────────────────────
  ui-test:
    name: 🎭 UI Test — Giao diện
    runs-on: ubuntu-latest
    needs: type-check-and-build

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: 🚀 Start dev server & chạy UI tests
        env:
          TURSO_DATABASE_URL: file:./sqlite.db
          TURSO_AUTH_TOKEN: ""
        run: npx playwright test --reporter=html

      - name: 📸 Upload Playwright test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
